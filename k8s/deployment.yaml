apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastsignal-frontend
  labels:
    app: lastsignal-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lastsignal-frontend
  template:
    metadata:
      labels:
        app: lastsignal-frontend
    spec:
      containers:
        - name: lastsignal-frontend
          # Replace <dockerhub-username> with your Docker Hub namespace.
          image: <dockerhub-username>/lastsignal-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
